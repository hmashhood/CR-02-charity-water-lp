<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>charity: water | Philanthropy with Integrity</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <img src="img/charitywater_logo_horizontal_AllWhite.png" alt="charity: water logo" class="nav-logo">
        </div>
        <div class="nav-links">
            <a href="#">Take Action</a>
            <a href="#">Our Mission</a>
            <a href="#">About Us</a>
            <span class="search-icon">Q</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-overlay">
            <div class="hero-text">
                <h1>Philanthropy with <br> 100% Integrity</h1>
                <p>Use your $10 to impact those who need it. charity:water assures you that we deliver your funds to the communities that need it most, supplying clean water for life.</p>
                
                <div class="donation-box">
                    <img src="img/jerry_can_yellow.png" alt="jerry can" class="jerry-icon">
                    <div class="toggle-group">
                        <button class="btn-toggle">Pay Once</button>
                        <button class="btn-toggle active">Pay Monthly</button>
                    </div>
                    <button class="btn-donate">Donate</button>
                    <p class="small-print">All proceeds go directly to our mission</p>
                </div>
            </div>
        </div>
    </header>

</body>
</html>
